<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D48B63" />
      <stop offset="100%" stop-color="#B2653E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D3A3" />
      <stop offset="100%" stop-color="#D4A968" />
    </linearGradient>
  </defs>

  <!-- Arch silhouette container -->
  <path
    d="M12,60 L12,24 C12,12.95 20.95,4 32,4 C43.05,4 52,12.95 52,24 L52,60 Z"
    fill="url(#terracottaGrad)"
  />

  <!-- Inner arch gold accent border -->
  <path
    d="M16,58 L16,24 C16,15.16 23.16,8 32,8 C40.84,8 48,15.16 48,24 L48,58"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="1.75"
    stroke-dasharray="none"
  />

  <!-- Elegant Serif Letter "K" -->
  <text
    x="31"
    y="42"
    font-family="'Playfair Display', Georgia, serif"
    font-size="28"
    font-style="italic"
    font-weight="700"
    fill="#FFFFFF"
    text-anchor="middle"
  >K</text>

  <!-- Mini gold star accent top right of arch -->
  <path
    d="M44,14 L45,17 L48,18 L45,19 L44,22 L43,19 L40,18 L43,17 Z"
    fill="url(#goldGrad)"
  />
</svg>
